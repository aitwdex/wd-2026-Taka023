<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界の天気予報</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  
</head>
<body class="bg-info">

  <div class="container my-4 d-flex flex-column align-items-center text-center"> 
    <h1 class="text-center">リアルタイムの天気</h1>
    <h4>このサイトでは名古屋、東京、大阪、静岡の日本の4箇所のリアルタイムの天気を検索できます</h4>

    <div class="mb-3 d-flex flex-column align-items-center w-100">
      <label for="citySelect" class="form-label">都市を選択してください</label>
      
      <select id="citySelect" class="form-select text-center" style="max-width: 320px; width: 100%;">
        <option value="35.18,136.91">名古屋</option>
        <option value="35.68,139.76">東京</option>
        <option value="34.69,135.50">大阪</option>
        <option value="34.58,138.22">静岡</option>
      </select>
    </div>

    <button id="getBtn" class="btn btn-primary text-center">天気を取得</button>

   
    <div id="result" class="card mt-3" style="max-width: 320px; width: 100%;">
      <div class="card-body">
        <p id="temp" class="card-text">都市を選んでボタンを押してください</p>
      </div>
    </div>

    

  
<footer class="text-center">
    <h5 class="text-center">出典</h5>
  <small >Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>（CC BY 4.0）</small>
</footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
